  <style>
    :root { color-scheme: light; --ink:#263342; --muted:#617184; --line:#dce3ea; --paper:#fff; --soft:#f3f6f8; --accent:#276b78; }
    * { box-sizing:border-box }
    body { margin:0; color:var(--ink); background:var(--soft); font:16px/1.75 system-ui,-apple-system,"Segoe UI",sans-serif }
    .doc-sidebar { position:fixed; inset:0 auto 0 0; width:260px; overflow:auto; padding:28px 20px; background:#fff; border-right:1px solid var(--line) }
    .doc-sidebar-title { display:block; margin-bottom:22px; color:var(--ink); font-weight:700; text-decoration:none }
    .doc-nav { display:grid; gap:5px }
    .doc-nav a { padding:8px 10px; color:var(--muted); text-decoration:none; border-radius:7px }
    .doc-nav a:hover,.doc-nav a[aria-current="page"] { color:var(--accent); background:#edf5f5 }
    .doc-nav-group > summary { padding:8px 10px; color:var(--ink); font-weight:700; cursor:pointer; border-radius:7px }
    .doc-nav-group > summary:hover,.doc-nav-group[open] > summary { color:var(--accent); background:#edf5f5 }
    .doc-nav-overview { display:block; margin-left:10px; font-weight:600 }
    .doc-nav-subpages { display:grid; gap:2px; margin-left:10px; padding-left:10px; border-left:1px solid var(--line) }
    .doc-nav-subpages a { display:block; padding:6px 10px; font-size:.92rem }
    .doc-main { max-width:900px; margin:0 auto 0 260px; padding:46px clamp(24px,6vw,76px) 80px }
    .doc-header,.doc-section { padding:28px 34px; margin-bottom:18px; background:var(--paper); border:1px solid var(--line); border-radius:14px }
    h1,h2 { line-height:1.3 } h1 { margin:0; font-size:2rem } h2 { margin-top:0 }
    .doc-purpose { color:var(--muted) }
    .doc-callout { margin:20px 0; padding:14px 18px; border-left:4px solid var(--accent); background:#f0f6f6 }
    @media(max-width:760px) { .doc-sidebar { position:static; width:auto; border-right:0; border-bottom:1px solid var(--line) }.doc-main { margin:0; padding:24px 16px 48px }.doc-header,.doc-section { padding:22px } }

    @page { margin: 14mm; }
    @media print {
      body { color:#111; background:#fff; font-size:11pt; line-height:1.5; }
      .doc-sidebar { display:none !important; }
      .doc-main { max-width:none; margin:0; padding:0; }
      .doc-header,.doc-section { margin:0 0 12pt; padding:0; color:#111; background:#fff; border:0; border-radius:0; }
      h1,h2,h3 { color:#111; break-after:avoid-page; page-break-after:avoid; }
      h1 { font-size:20pt; }
      h2 { font-size:14pt; }
      p,li { orphans:3; widows:3; overflow-wrap:anywhere; }
      .doc-callout { padding:8pt 10pt; color:#111; background:#fff; border:1px solid #555; border-left:4px solid #333; }
      code { padding:0; color:#111; background:transparent; }
      pre { max-width:100%; overflow:visible; white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; color:#111; background:#fff; border:1px solid #999; border-radius:0; break-inside:auto; page-break-inside:auto; }
      table { width:100%; border-collapse:collapse; break-inside:auto; }
      thead { display:table-header-group; }
      tr { break-inside:avoid; page-break-inside:avoid; }
      th,td { padding:4pt; border:1px solid #888; overflow-wrap:anywhere; }
      a { color:inherit; text-decoration:underline; overflow-wrap:anywhere; }
    }
